<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kuro Active Tab Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #e2e8f0;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .header h2 {
      margin: 0;
      font-size: 14px;
      color: #06b6d4;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .status-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .mono {
      font-family: monospace;
      color: #38bdf8;
    }
    .btn {
      display: block;
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 6px;
      text-align: center;
    }
    .btn:hover {
      background: #334155;
      color: #fff;
    }
    .privacy-notice {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      margin-top: 10px;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 Kuro Tab Bridge</h2>
  </div>

  <div class="toggle-row">
    <span>Share Active Domain</span>
    <input type="checkbox" id="toggleTracking">
  </div>

  <div class="status-box">
    <div>Active Tab Domain:</div>
    <div id="activeDomain" class="mono" style="margin-top: 4px;">Detecting...</div>
  </div>

  <button class="btn" id="btnExcludeDomain">Exclude This Domain</button>
  <button class="btn" id="btnPause30">Pause for 30 Mins</button>

  <div class="privacy-notice">
    <strong>Privacy Guarantee:</strong> Only sends hostname (e.g. github.com) and page title to your local loopback desktop companion (127.0.0.1:48199). Never reads forms, DOM, or passwords.
  </div>

  <script src="popup.js"></script>
</body>
</html>
