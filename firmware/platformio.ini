; Kuro Robot Companion — ESP32 Firmware Configuration
; Supported Hardware Variants:
; - esp32s3_n8r8: ESP32-S3-WROOM-1-N8R8 (8MB Flash, 8MB Octal PSRAM - qio_opi) [DEFAULT]
; - esp32s3_n16r8: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM - qio_opi)
; - esp32s3_n8r2: ESP32-S3-WROOM-1-N8R2 (8MB Flash, 2MB Quad PSRAM - qio_qspi)
; - esp32s3_no_psram: Generic ESP32-S3 DevKit without external PSRAM (4MB/8MB Flash)
; - esp32_wroom_oled: ESP32-WROOM-32 DevKit V1 (38-pin, 4MB Flash) + 0.96" SSD1306 I2C OLED (128x64)
;
; Visor Displays:
; - 2.4" SPI TFT LCD (320x240, ILI9341 or ST7789) on ESP32-S3
; - 0.96" I2C OLED (128x64, SSD1306) on ESP32-WROOM-32
; Framework: Arduino on Espressif32

[platformio]
default_envs = esp32s3_n8r8, esp32_wroom_oled
src_dir = src
include_dir = include
core_dir = F:\.platformio

; Shared base configuration
[env]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DKURO_FIRMWARE_VERSION=\"0.1.0\"
    -DKURO_PROTOCOL_VERSION=\"1.0\"
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1
    lovyan03/LovyanGFX @ ^1.1.12

; Environment 1: 8MB Flash + 8MB Octal PSRAM (N8R8) - Target Production Board
[env:esp32s3_n8r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; Environment 2: 16MB Flash + 8MB Octal PSRAM (N16R8)
[env:esp32s3_n16r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; Environment 3: 8MB Flash + 2MB Quad PSRAM (N8R2)
[env:esp32s3_n8r2]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; Environment 4: Generic ESP32-S3 without PSRAM (Runs 100% inside 512KB internal SRAM)
[env:esp32s3_no_psram]
board_build.arduino.memory_type = qio_qio
board_build.flash_mode = qio
board_upload.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -DNO_PSRAM_FALLBACK

; Environment 5: ESP32-WROOM-32 DevKit V1 (38-pin, 4MB Flash) + 0.96" SSD1306 I2C OLED (128x64)
[env:esp32_wroom_oled]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DKURO_FIRMWARE_VERSION=\"0.1.0\"
    -DKURO_PROTOCOL_VERSION=\"1.0\"
    -DKURO_TARGET_ESP32_WROOM
    -DKURO_DISPLAY_SSD1306_OLED
    -DOLED_SCREEN_WIDTH=128
    -DOLED_SCREEN_HEIGHT=64
    -DKURO_PIN_OLED_SDA=21
    -DKURO_PIN_OLED_SCL=22
    -DKURO_OLED_I2C_ADDR=0x3C
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1
    lovyan03/LovyanGFX @ ^1.1.12
